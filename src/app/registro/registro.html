<div class="container">
  <h2>Formulario de Registro</h2>

  <!-- Formulario Template Driven con #registroForm="ngForm" -->
  <form #registroForm="ngForm" (ngSubmit)="onRegistrar()">
    
    <div class="form-group">
      <label for="nombre">Nombre completo:</label>
      <input 
        type="text" 
        id="nombre" 
        name="nombreCompleto" 
        [(ngModel)]="usuario.nombreCompleto" 
        required>
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        [(ngModel)]="usuario.email" 
        required>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input 
        type="tel" 
        id="telefono" 
        name="telefono" 
        [(ngModel)]="usuario.telefono" 
        required>
    </div>

    <div class="form-group">
      <label for="edad">Edad:</label>
      <input 
        type="number" 
        id="edad" 
        name="edad" 
        [(ngModel)]="usuario.edad" 
        required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        [(ngModel)]="usuario.password" 
        required>
    </div>

    <div class="form-group">
      <label for="confirmarPassword">Confirmar contraseña:</label>
      <input 
        type="password" 
        id="confirmarPassword" 
        name="confirmarPassword" 
        [(ngModel)]="usuario.confirmarPassword" 
        required>
    </div>

    <button type="submit">Registrar</button>
  </form>

  <!-- Resultado mostrado debajo del formulario tras presionar el botón -->
  <div *ngIf="datosRegistrados" class="resultado">
    <h3>Información Capturada:</h3>
    <p><strong>Nombre completo:</strong> {{ datosRegistrados.nombreCompleto }}</p>
    <p><strong>Correo electrónico:</strong> {{ datosRegistrados.email }}</p>
    <p><strong>Teléfono:</strong> {{ datosRegistrados.telefono }}</p>
    <p><strong>Edad:</strong> {{ datosRegistrados.edad }}</p>
    <p><strong>Contraseña:</strong> ********</p>
  </div>
</div>
